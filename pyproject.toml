[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assent"
version = "0.1.0"
description = "Deterministic core of the Assent gating engine: the Change primitive and the PolicyEngine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["assent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
